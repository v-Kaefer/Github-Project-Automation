name: Project setup

on:
  workflow_dispatch:
    inputs:
      run_labels_sync:
        description: "Synchronize labels"
        required: true
        default: true
        type: boolean
      run_milestones_sync:
        description: "Synchronize milestones"
        required: true
        default: true
        type: boolean
      run_issue_generation:
        description: "Generate backlog issues and tasks"
        required: true
        default: false
        type: boolean
      run_project_creation:
        description: "Create a GitHub Project v2 (requires PROJECT_SETUP_PAT for live runs)"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Plan changes without writing to GitHub"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: project-setup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create GitHub App installation token
        id: app-token
        if: ${{ vars.PROJECT_SETUP_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PROJECT_SETUP_APP_ID }}
          private-key: ${{ secrets.PROJECT_SETUP_APP_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate embedded setup package and configuration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_SETUP_AUTH: ${{ vars.PROJECT_SETUP_APP_ID != '' && 'app' || 'token' }}
          PROJECT_SETUP_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_SETUP_PAT: ${{ secrets.PROJECT_SETUP_PAT }}
        run: |
          set -euo pipefail
          python -m compileall -q project_setup
          python -m project_setup doctor --config project_setup.json

      - name: Require App token or PAT for live Project v2 creation
        if: ${{ inputs.run_project_creation && !inputs.dry_run }}
        env:
          PROJECT_SETUP_PAT: ${{ secrets.PROJECT_SETUP_PAT }}
          PROJECT_SETUP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_SETUP_TOKEN:-}" ] && [ -z "${PROJECT_SETUP_PAT:-}" ]; then
            echo "::error title=Project credential required::Configure the recommended GitHub App or the PROJECT_SETUP_PAT fallback."
            exit 1
          fi
          echo "A Project credential is configured for the requested live operation."

      - name: Apply project setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_SETUP_AUTH: ${{ vars.PROJECT_SETUP_APP_ID != '' && 'app' || 'token' }}
          PROJECT_SETUP_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_SETUP_PAT: ${{ secrets.PROJECT_SETUP_PAT }}
        run: |
          set -euo pipefail
          args="--config project_setup.json"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          else
            args="$args --live"
          fi
          if [ "${{ inputs.run_labels_sync }}" = "true" ]; then
            args="$args --run-labels"
          else
            args="$args --skip-labels"
          fi
          if [ "${{ inputs.run_milestones_sync }}" = "true" ]; then
            args="$args --run-milestones"
          else
            args="$args --skip-milestones"
          fi
          if [ "${{ inputs.run_issue_generation }}" = "true" ]; then
            args="$args --run-issue-generation"
          else
            args="$args --skip-issue-generation"
          fi
          if [ "${{ inputs.run_project_creation }}" = "true" ]; then
            args="$args --run-project-creation"
          else
            args="$args --skip-project-creation"
          fi
          python -m project_setup apply $args

name: Q.A validation

on:
  pull_request:
    branches: ["Q.A"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["Q.A"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: repository-quality / ubuntu / py3.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run complete repository checks
        run: make check

  compatibility:
    name: compatibility / ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --yes --no-progress

      - name: Install package
        run: python -m pip install .

      - name: Verify installed package
        run: python -m pip check

      - name: Verify Python module entrypoint
        run: python -m project_setup --help

      - name: Verify project-setup entrypoint
        run: project-setup --help

      - name: Verify project_setup entrypoint
        run: project_setup --help

      - name: Run Q.A black-box tests
        run: python -m unittest discover -s tests/qa -p "test_*.py" -v

      - name: Verify Makefile environment contract
        run: python -m unittest discover -s tests -p "test_makefile_env_defaults.py" -v

      - name: Run read-only doctor through Make
        run: make doctor

  package-artifact:
    name: package-artifact / wheel-and-sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build frontend
        run: python -m pip install build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Create clean verification environment
        run: python -m venv .qa-venv

      - name: Install built wheel
        run: .qa-venv/bin/python -m pip install dist/*.whl

      - name: Verify installed wheel
        run: |
          .qa-venv/bin/python -m pip check
          .qa-venv/bin/python -m project_setup --help
          .qa-venv/bin/project-setup --help
          .qa-venv/bin/project_setup --help

  qa-gate:
    name: qa-gate
    if: always()
    needs: [repository-quality, compatibility, package-artifact]
    runs-on: ubuntu-latest
    steps:
      - name: Require all deterministic Q.A jobs to pass
        shell: bash
        env:
          REPOSITORY_QUALITY_RESULT: ${{ needs.repository-quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          PACKAGE_ARTIFACT_RESULT: ${{ needs.package-artifact.result }}
        run: |
          set -euo pipefail
          echo "repository-quality=$REPOSITORY_QUALITY_RESULT"
          echo "compatibility=$COMPATIBILITY_RESULT"
          echo "package-artifact=$PACKAGE_ARTIFACT_RESULT"
          if [ "$REPOSITORY_QUALITY_RESULT" != "success" ] || \
             [ "$COMPATIBILITY_RESULT" != "success" ] || \
             [ "$PACKAGE_ARTIFACT_RESULT" != "success" ]; then
            echo "Q.A deterministic gate failed." >&2
            exit 1
          fi
          echo "Q.A deterministic gate passed."

name: Q.A live sandbox

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Trusted same-repository ref that passed PR guardrails"
        required: true
        type: string
      pr_number:
        description: "Main-targeting pull request being validated"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qa-live-sandbox
  cancel-in-progress: true

jobs:
  live-sandbox:
    name: qa-live-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: qa
      deployment: false
    steps:
      - name: Checkout guarded candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install .

      - name: Validate Q.A environment configuration
        shell: bash
        env:
          QA_REPOSITORY: ${{ vars.QA_REPOSITORY }}
          QA_PROJECT_SETUP_PAT: ${{ secrets.QA_PROJECT_SETUP_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${QA_REPOSITORY:-}" ]; then
            echo "::error title=QA_REPOSITORY missing::Create GitHub Environment 'qa' and set variable QA_REPOSITORY to a dedicated sandbox repository."
            exit 1
          fi
          if [ -z "${QA_PROJECT_SETUP_PAT:-}" ]; then
            echo "::error title=QA_PROJECT_SETUP_PAT missing::Add a PAT with repo and project access to GitHub Environment 'qa' as QA_PROJECT_SETUP_PAT."
            exit 1
          fi
          if [ "$QA_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            echo "::error title=Unsafe Q.A target::QA_REPOSITORY must not be the source repository. Use a dedicated disposable sandbox."
            exit 1
          fi
          echo "Q.A sandbox configuration is present. Secret values were not printed."

      - name: Run live self-cleaning resource integration test
        env:
          QA_REPOSITORY: ${{ vars.QA_REPOSITORY }}
          PROJECT_SETUP_PAT: ${{ secrets.QA_PROJECT_SETUP_PAT }}
        run: >-
          python tests/qa/live_sandbox.py
          --repo "$QA_REPOSITORY"
          --run-id "pr-${{ inputs.pr_number }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Run live PR Sync structured metadata test
        env:
          QA_REPOSITORY: ${{ vars.QA_REPOSITORY }}
          PROJECT_SETUP_PAT: ${{ secrets.QA_PROJECT_SETUP_PAT }}
        run: >-
          python tests/qa/live_pr_sync.py
          --repo "$QA_REPOSITORY"
          --run-id "pr-${{ inputs.pr_number }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Run live implementation PR Project membership test
        env:
          QA_REPOSITORY: ${{ vars.QA_REPOSITORY }}
          PROJECT_SETUP_PAT: ${{ secrets.QA_PROJECT_SETUP_PAT }}
        run: >-
          python tests/qa/live_implementation_project.py
          --repo "$QA_REPOSITORY"
          --run-id "pr-${{ inputs.pr_number }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Run live Promotion Sync native metadata test
        env:
          QA_REPOSITORY: ${{ vars.QA_REPOSITORY }}
          PROJECT_SETUP_PAT: ${{ secrets.QA_PROJECT_SETUP_PAT }}
        run: >-
          python tests/qa/live_promotion_sync.py
          --repo "$QA_REPOSITORY"
          --run-id "pr-${{ inputs.pr_number }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Run live Development linked-branch test
        env:
          QA_REPOSITORY: ${{ vars.QA_REPOSITORY }}
          PROJECT_SETUP_PAT: ${{ secrets.QA_PROJECT_SETUP_PAT }}
        run: >-
          python tests/qa/live_linked_branch.py
          --repo "$QA_REPOSITORY"
          --run-id "pr-${{ inputs.pr_number }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

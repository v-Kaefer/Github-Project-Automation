name: PR metadata validation

on:
  workflow_run:
    workflows: ["PR Sync"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-metadata-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate branch name and pull request metadata
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/validation/validate_pr_body.py \
            --repo "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --skip-draft-or-closed \
            --comment

  qa-live:
    name: live-qa-after-guardrails
    needs: validate-pr
    if: >-
      needs.validate-pr.result == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].head.ref == 'Q.A' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main'
    uses: ./.github/workflows/qa-live.yml
    with:
      checkout_ref: refs/heads/Q.A
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
    secrets: inherit

  qa-deployment-cleanup:
    name: clean-old-qa-deployments
    needs: qa-live
    if: >-
      always() &&
      needs.qa-live.result != 'skipped' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].head.ref == 'Q.A' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Remove historical Q.A deployment records
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python tests/qa/cleanup_deployments.py \
            --repo "$GITHUB_REPOSITORY" \
            --environment qa

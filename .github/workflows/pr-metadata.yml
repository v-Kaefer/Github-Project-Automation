---
name: PR metadata validation

"on":
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Autofill recoverable pull request metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -m project_setup.pr_autofill \
            --repo "$GITHUB_REPOSITORY" \
            --event-path "$GITHUB_EVENT_PATH"

      - name: Validate live branch name and pull request metadata
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/validation/validate_pr_body.py \
            --repo "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --comment

  qa-live:
    name: live-qa-after-guardrails
    needs: validate-pr
    if: >-
      needs.validate-pr.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'Q.A' &&
      github.event.pull_request.base.ref == 'main'
    uses: ./.github/workflows/qa-live.yml
    with:
      checkout_ref: refs/heads/Q.A
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  qa-deployment-cleanup:
    name: clean-old-qa-deployments
    needs: qa-live
    if: >-
      always() &&
      needs.qa-live.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'Q.A' &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Remove historical Q.A deployment records
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python tests/qa/cleanup_deployments.py \
            --repo "$GITHUB_REPOSITORY" \
            --environment qa

name: PR metadata validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate-pr-body:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure required PR sections and issue link
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          required=("Linked Issue" "Summary" "How to test")
          for section in "${required[@]}"; do
            if ! echo "$PR_BODY" | grep -qF "## $section"; then
              echo "Missing required PR section: ## $section" >&2
              exit 1
            fi
          done
          if ! echo "$PR_BODY" | grep -qE 'Closes #[0-9]+|Fixes #[0-9]+|Resolves #[0-9]+'; then
            echo "PR body must reference a linked issue (e.g. Closes #123)" >&2
            exit 1
          fi

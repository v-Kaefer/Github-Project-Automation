name: Auto label

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write

concurrency:
  group: auto-label-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted repository automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply inferred labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m project_setup auto-label apply

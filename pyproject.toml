[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-project-setup"
version = "0.2.1"
description = "Reusable CLI for setting up GitHub repository workflows, labels, milestones, issues and Projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["github", "automation", "repository", "project-management", "github-actions"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
project-setup = "project_setup.cli:main"
project_setup = "project_setup.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["project_setup*"]
